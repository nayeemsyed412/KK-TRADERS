services:
  - type: web
    name: kk-traders-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kk-traders-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://nayeemsyed412.github.io
      - key: PGSSL
        value: "true"

databases:
  - name: kk-traders-db
    databaseName: kk_traders
    user: kk_traders
